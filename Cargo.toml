[package]
name = "sellapp-sdk"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Official Rust SDK for the SellApp API: manage products, orders, subscriptions, and customers."
homepage = "https://sell.app"
keywords = ["sellapp", "api", "sdk", "commerce"]
categories = ["api-bindings"]
readme = "README.md"
repository = "https://github.com/sellapp/sellapp-rust"
documentation = "https://sell.app/docs/api"
include = ["src/**", "examples/**", "docs/**", "Cargo.toml", "README.md", "LICENSE.txt", "NOTICE.txt"]
[lib]
name = "sellapp"
[dependencies]
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
urlencoding = "2"
futures-util = "0.3"
async-stream = "0.3"
http = "1"
httpdate = "1"
tokio = { version = "1", features = ["time"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
