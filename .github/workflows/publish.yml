# Generated manual publication; pushes and tags never publish automatically.
name: Publish validated Rust crate
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag containing the validated package assets (vX.Y.Z)
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 from the reviewed local publication manifest
        required: true
        type: string
      publish:
        description: >-
          Upload to crates.io with a configured trusted publisher after verification (leave unchecked for
          verification only)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: rust-crates-io-publication
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'sellapp/sellapp-rust' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.verified_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify retained package hashes and source identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: python3 .github/scripts/verify-rust-publication.py --tag "$RELEASE_TAG" --sha256 "$MANIFEST_SHA256"
      - name: Retain verified distributions
        id: verified_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-crates-io-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: inputs.publish && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/sellapp-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: dist/
      - name: Exchange the GitHub identity for a short-lived crates.io credential
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - name: Upload the exact verified crate without rebuilding
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: >-
          python3 .github/scripts/verify-rust-publication.py --publish-retained --tag "$RELEASE_TAG" --sha256
          "$MANIFEST_SHA256"
